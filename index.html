<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://a.espncdn.com">
<meta name="theme-color" content="#0b0d1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Court Kings: a retro pixel basketball franchise game. Coach your team, play the big possessions, build a dynasty.">
<title>Court Kings - Retro Hoops Dynasty</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css?v=2.5.0">
</head>
<body>
<div id="app"></div>
<div id="game">
  <div id="stage">
    <canvas></canvas>
    <div id="hud"></div>
    <button id="pauseBtn" aria-label="Pause"><i></i><i></i></button>
    <div id="banner"></div>
    <div id="flash"></div>
    <div id="ticker"></div>
    <div id="keys">WASD / ARROWS MOVE &nbsp; SPACE SHOOT / BLOCK &nbsp; K PASS &nbsp; 1-5 PASS TO &nbsp; E CROSS &nbsp; F SPIN &nbsp; R HESI &nbsp; Q STEP-BACK &nbsp; C BEHIND BACK &nbsp; L / E STEAL &nbsp; P PAUSE</div>
    <div id="ov"></div>
  </div>
  <div id="controls">
    <div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div>
    <div id="btns"><button id="btnC" class="gb c">STEAL</button><button id="btnB" class="gb b">PASS</button><button id="btnA" class="gb a">SHOOT</button><button id="mvX" class="gb mv m1" data-mv="cross">CROSS</button><button id="mvS" class="gb mv m2" data-mv="spin">SPIN</button><button id="mvH" class="gb mv m3" data-mv="hesi">HESI</button><button id="mvK" class="gb mv m4" data-mv="step">STEP<br>BACK</button></div>
  </div>
  <div id="rotate"><div class="ph"></div>TURN YOUR PHONE SIDEWAYS</div>
</div>
<div id="modal"></div>
<div id="turn"><div class="ph"></div>TURN YOUR PHONE SIDEWAYS<small>Court Kings is made for landscape</small></div>
<div id="toast"></div>
<script src="js/util.js?v=2.5.0"></script>
<script src="js/rosters.js?v=2.5.0"></script>
<script src="js/data.js?v=2.5.0"></script>
<script src="js/league.js?v=2.5.0"></script>
<script src="js/offseason.js?v=2.5.0"></script>
<script src="js/events.js?v=2.5.0"></script>
<script src="js/front.js?v=2.5.0"></script>
<script src="js/sfx.js?v=2.5.0"></script>
<script src="js/input.js?v=2.5.0"></script>
<script src="js/court.js?v=2.5.0"></script>
<script src="js/sprites.js?v=2.5.0"></script>
<script src="js/render.js?v=2.5.0"></script>
<script src="js/match.js?v=2.5.0"></script>
<script src="js/net.js?v=2.5.0"></script>
<script src="js/ui.js?v=2.5.0"></script>
<script src="js/quick.js?v=2.5.0"></script>
<script src="js/main.js?v=2.5.0"></script>
</body>
</html>
