<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Court Kings: a retro pixel basketball franchise game. Coach your team, play the big possessions, build a dynasty.">
<title>Court Kings - Retro Hoops Dynasty</title>
<link rel="icon" href="icons/icon-192.png">

<body>
<div id="app"></div>
<div id="game">
  <div id="hud"></div>
  <button id="pauseBtn" aria-label="Pause"><i></i><i></i></button>

  </div>
  <div id="ov"></div>
</div>
<div id="modal"></div>
<div id="toast"></div>
<script src="js/util.js?v=1.0.0"></script>
<script src="js/data.js?v=1.0.0"></script>

<script src="js/events.js?v=1.0.0"></script>
<script src="js/sfx.js?v=1.0.0"></script>
<script src="js/input.js?v=1.0.0"></script>

<script src="js/render.js?v=1.0.0"></script>
<script src="js/match.js?v=1.0.0"></script>
<script src="js/ui.js?v=1.0.0"></script>
<script src="js/main.js?v=1.0.0"></script>

</html>
